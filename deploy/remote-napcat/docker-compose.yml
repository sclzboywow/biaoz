services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    hostname: DESKTOP-PC7K2M
    restart: always
    network_mode: host
    env_file:
      - path: .env.runtime
        required: false
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      # ACCOUNT 仅由 .env.runtime 提供（扫码/快速登录成功后由 watchdog 写入），不在 compose 写死
    volumes:
      - /home/ubuntu/napcat/config:/app/napcat/config
      - /home/ubuntu/napcat/qq-data:/app/.config/QQ
    mem_limit: 1536m
    memswap_limit: 2048m
