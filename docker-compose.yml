# 单一数据库策略：所有服务共用宿主机 PostgreSQL（与 backend/.env 中 localhost:5432 为同一实例）。
# 容器内通过 host.docker.internal 访问；请勿再使用 compose 内置 postgres 卷，避免「双库」混淆。
#
# 前置条件：本机 PostgreSQL 已运行，且存在库 biaoz（账号见下方 DATABASE_URL）。

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://biaoz:biaoz@host.docker.internal:5432/biaoz}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/standard-docs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      COLLECTION_TASK_INLINE_WORKER: ${COLLECTION_TASK_INLINE_WORKER:-false}
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/data/standard-docs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-60000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  collection-worker:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.collection_worker", "--poll-seconds", "10"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://biaoz:biaoz@host.docker.internal:5432/biaoz}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/standard-docs}
    volumes:
      - document_storage:/data/standard-docs
    depends_on:
      api:
        condition: service_healthy

  ocr-worker:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.ocr_download_worker", "--poll-seconds", "10"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://biaoz:biaoz@host.docker.internal:5432/biaoz}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/standard-docs}
    volumes:
      - document_storage:/data/standard-docs
    depends_on:
      api:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:1.72.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: host.docker.internal
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-biaoz}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-biaoz}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-long-random-string}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - document_storage:/data/standard-docs

volumes:
  n8n_data:
  document_storage:
