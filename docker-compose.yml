services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biaoz}
      POSTGRES_USER: ${POSTGRES_USER:-biaoz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biaoz}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biaoz} -d ${POSTGRES_DB:-biaoz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://biaoz:biaoz@postgres:5432/biaoz}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/standard-docs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      COLLECTION_TASK_INLINE_WORKER: ${COLLECTION_TASK_INLINE_WORKER:-false}
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/data/standard-docs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-60000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  collection-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.collection_worker", "--poll-seconds", "10"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://biaoz:biaoz@postgres:5432/biaoz}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/standard-docs}
    volumes:
      - document_storage:/data/standard-docs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  ocr-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.ocr_download_worker", "--poll-seconds", "10"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://biaoz:biaoz@postgres:5432/biaoz}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/standard-docs}
    volumes:
      - document_storage:/data/standard-docs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  n8n:
    image: n8nio/n8n:1.72.1
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-biaoz}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-biaoz}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-biaoz}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-long-random-string}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - document_storage:/data/standard-docs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  document_storage:
